[project]
name = "code-raqeeb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdallah Farag Abdelghani", email = "abdallahfarag797@hotmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.1",
    "fastembed>=0.9.1",
    "fastmcp>=4.1.6",
    "gorget==0.5.0",
    "guardrails-ai>=0.11.0",
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.23.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["guardrails"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: real-LLM quality evals; run with -m eval (uses Gemini quota)",
    "ml: loads the real injection model, may download it (run with: pytest -m ml)",
]
