[project]
name = "code-raqeeb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdallah Farag Abdelghani", email = "abdallahfarag797@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W style, F real errors, I import order, UP modern syntax,
# B likely bugs, SIM simplifications, ASYNC async mistakes, RUF Ruff rules
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]